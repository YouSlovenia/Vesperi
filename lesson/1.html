<div class="audio-section">
    <h3>Listen to Es'tara:</h3>
    <div class="audio-control" onclick="speakVesperi('Es-tara vireth-il', 'ɛʃ.ta.ɾa vi.ɾɛθ.il')">
        <span class="moon-symbol">🌑</span> Play
    </div>
</div>

<script>
    function speakVesperi(text, ipa) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US'; // Custom phonetics require IPA mapping
            utterance.pitch = 0.8; // Lower pitch for nocturnal ambiance
            utterance.rate = 0.9; // Slower cadence
            speechSynthesis.speak(utterance);
        } else {
            alert("Moon whispers silenced: Update your browser");
        }
    }
</script>
